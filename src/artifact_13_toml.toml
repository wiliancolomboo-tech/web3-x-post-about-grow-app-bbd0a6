[package]
name = "grow_social_vault"
version = "0.1.0"
description = "Grow App Social Campaign Attestation & Non-Custodial Yield Vault"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "grow_social_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.29.0", features = ["token"] }
solana-program = "1.17.0"