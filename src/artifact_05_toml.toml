[package]
name = "grow_engine"
version = "0.1.0"
description = "High-Performance Automated Compounding Vault Engine for Grow App on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "grow_engine"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "associated_token"] }
solana-program = "1.18"
thiserror = "1.0"